name: Mobile prototype checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-prototype.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-prototype.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
